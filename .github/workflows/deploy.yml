name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Build static site
        run: npm run build

      - name: Checkout farmaciagallego.github.io
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          repository: 'farmaciagallego/farmaciagallego.github.io'
          ssh-key: ${{ secrets.FARMACIA_DEPLOY_KEY }}
          path: 'farmacia-target'

      - name: Deploy juego to farmaciagallego.github.io
        if: github.event_name != 'pull_request'
        run: |
          cd farmacia-target
          rm -rf juego
          mkdir -p juego
          cp -r ../dist/* juego/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add juego
          if git diff --staged --quiet; then
            echo "No changes in juego to commit."
          else
            git commit -m "chore(juego): update game bundle from karlhiramoto/botica@${GITHUB_SHA::7}"
            git push origin main
          fi

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
